<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <style>
            @keyframes floatSteam {
                0%, 100% {
                    transform: translateY(0px);
                    opacity: 0.85;
                }
                50% {
                    transform: translateY(-4px);
                    opacity: 0.45;
                }
            }
            .steam-line-1 {
                animation: floatSteam 2.8s ease-in-out infinite;
            }
            .steam-line-2 {
                animation: floatSteam 2.8s ease-in-out 0.6s infinite;
            }
            .steam-line-3 {
                animation: floatSteam 2.8s ease-in-out 1.2s infinite;
            }
        </style>
    </defs>

    <!-- Nền tròn kem ấm giữ đúng theo mẫu thiết kế, 4 góc ngoài trong suốt hoàn toàn -->
    <circle cx="200" cy="200" r="176" fill="#FAF6F0" />

    <!-- Vòng tròn khung tối giản -->
    <circle id="svg-outer-ring" cx="200" cy="200" r="176" fill="none" stroke="#3B2314" stroke-width="4" />
    <circle id="svg-inner-ring" cx="200" cy="200" r="166" fill="none" stroke="#D97706" stroke-width="1.4" stroke-dasharray="140 16 8 16" />

    <!-- Họa tiết điểm nhấn 4 hướng trên vòng tròn -->
    <circle id="svg-dot-top" cx="200" cy="34" r="2.5" fill="#D97706" />
    <circle id="svg-dot-bottom" cx="200" cy="366" r="2.5" fill="#D97706" />
    <circle id="svg-dot-left" cx="34" cy="200" r="2.5" fill="#D97706" />
    <circle id="svg-dot-right" cx="366" cy="200" r="2.5" fill="#D97706" />

    <!-- Nhóm biểu tượng trung tâm được phóng to và căn giữa hoàn hảo -->
    <g id="svg-center-emblem" transform="translate(200, 200) scale(1.38) translate(-200, -158)">
        <!-- Vòng hào quang ấm phía sau bát -->
        <circle id="svg-halo" cx="200" cy="158" r="56" fill="#F59E0B" opacity="0.16" />

        <!-- Đôi đũa & Thìa cách điệu đặt chéo nhẹ sau bát -->
        <g id="svg-utensils" stroke="#3B2314" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- Đôi đũa thanh mảnh nghiêng từ trái sang -->
            <line x1="132" y1="112" x2="256" y2="214" />
            <line x1="143" y1="102" x2="262" y2="208" stroke-width="2.5" />

            <!-- Thìa cách điệu nghiêng từ phải sang -->
            <line x1="252" y1="126" x2="144" y2="214" />
            <ellipse id="svg-spoon-head" cx="264" cy="116" rx="15" ry="10" transform="rotate(-39 264 116)" fill="#D97706" stroke="#3B2314" stroke-width="3.2" />
        </g>

        <!-- 3 Làn khói tỏa nhẹ thanh thoát -->
        <g id="svg-steam" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round">
            <path class="steam-line-1" d="M 180 124 C 175 113, 185 105, 180 94" />
            <path class="steam-line-2" d="M 200 120 C 194 107, 206 98, 200 85" />
            <path class="steam-line-3" d="M 220 124 C 215 113, 225 105, 220 94" />
        </g>

        <!-- Bát ăn tối giản hiện đại -->
        <g id="svg-bowl">
            <!-- Đế bát -->
            <path id="svg-bowl-base" d="M 181 198 L 219 198 L 215 206 L 185 206 Z" fill="#3B2314" />
            <!-- Thân bát nửa hình cầu -->
            <path id="svg-bowl-body" d="M 142 142 C 142 180, 168 198, 200 198 C 232 198, 258 180, 258 142 Z" fill="#B45309" stroke="#3B2314" stroke-width="3.5" stroke-linejoin="round" />
            <!-- Đường nhấn ánh sáng trên thân bát -->
            <path id="svg-bowl-highlight" d="M 155 154 C 157 174, 173 186, 194 188" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
            <!-- Miệng bát -->
            <rect id="svg-bowl-rim" x="138" y="137" width="124" height="7" rx="3.5" fill="#F59E0B" stroke="#3B2314" stroke-width="3" />
        </g>

        <!-- Lá thảo mộc nhỏ tối giản hai bên đế bát -->
        <g id="svg-leaves">
            <path id="svg-leaf-left" d="M 168 198 C 152 198, 144 186, 146 177 C 156 177, 166 186, 168 198 Z" fill="#15803D" stroke="#3B2314" stroke-width="2.5" stroke-linejoin="round" />
            <path id="svg-leaf-right" d="M 232 198 C 248 198, 256 186, 254 177 C 244 177, 234 186, 232 198 Z" fill="#15803D" stroke="#3B2314" stroke-width="2.5" stroke-linejoin="round" />
        </g>
    </g>
</svg>
